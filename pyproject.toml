[project]
name = "hippocampus"
version = "0.1.0"
description = "Temporal RAG for AI agents, built on pg_kafka"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trent Jones", email = "rtrentjones@gmail.com" }]
keywords = ["rag", "kafka", "postgres", "mcp", "ai-agents", "embeddings"]

dependencies = [
    "mcp>=1.0.0",
    "kafka-python-ng>=2.2.2",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
local = [
    "sentence-transformers>=2.2.0",
]

[project.scripts]
hippocampus = "hippocampus.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocampus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/hippocampus"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["kafka.*", "pgvector.*", "sentence_transformers.*", "mcp.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests with mocked dependencies",
    "integration: Integration tests requiring database",
    "e2e: End-to-end tests requiring full infrastructure",
    "requires_local_embeddings: Tests that require local embedding provider",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
