name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Unit tests
        run: pytest tests/unit -v

  integration:
    name: Integration & E2E tests
    runs-on: ubuntu-latest
    # The database image builds pg_kafka from source (5-10 min uncached);
    # GHA layer caching makes subsequent runs fast.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - uses: docker/setup-buildx-action@v3

      - name: Build test database image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.test-postgres
          tags: hippocampus-postgres:test-latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test database
        run: |
          # docker-compose.test.yml expects the devcontainer network to exist
          docker network create hippocampus_devcontainer_default
          docker compose -f docker-compose.test.yml up -d --no-build --wait --wait-timeout 120

      - name: Integration tests
        run: pytest tests/integration -v
        env:
          CI: "true"

      - name: E2E tests
        run: pytest tests/e2e -v
        env:
          CI: "true"

      - name: Database logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs postgres-test

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
